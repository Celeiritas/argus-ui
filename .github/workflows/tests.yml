# The browser checks (tests/run.sh: build, fake systemd units, Playwright + Chromium) on Linux, for every pull request
# and push to main. Pushing a ci/<anything> branch runs them too, to check a branch without opening a pull request.
name: tests
on:
  pull_request:
  push:
    branches: [main, 'ci/**']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # check-deck.py resolves lesson code references at their commit
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Chromium's system packages come from Ubuntu's mirrors. When the runner cannot reach them (seen for hours
      # on 2026-11-11: only a few font packages were missing, the runner image already had every library), the
      # browser alone is installed and the run carries a warning. The tests still decide.
      - name: Playwright and Chromium
        run: |
          npm install --no-audit --no-fund
          if ! timeout 600 npx playwright install --with-deps chromium; then
            echo "::warning title=Ubuntu mirrors unreachable::Chromium was installed without its system packages (some fonts may be missing). The tests below still decide."
            npx playwright install chromium
          fi
      - name: tests/run.sh
        run: bash tests/run.sh
