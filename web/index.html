<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C2127">
<title>Argus</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="static/argus-192.png">
<link rel="apple-touch-icon" href="static/argus-192.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Design tokens. Spacing: 4pt micro / 8pt major grid. Type: 16 body, 14 secondary, 12 meta; weights 400/600 only.
   Motion: 100/150/200/300ms for UI chrome. The god "powers" (petrify, crumble, lightning) are a documented exception:
   they are one-shot feedback moments that last as long as the action, and are skipped under reduced motion. */
:root{--night:#1C2127;--slate:#3A434C;--card:#232A31;--line:#36404A;--snow:#E6ECF1;--powder:#A7B6C4;--frost:#8C99A6;
 --teal:#2A9D8F;--ok:#7BD88F;--bad:#F0859A;--run:#F1CD7D;--stone:#8FC4A4;--bolt:#FFE27A;--danger:#F87171;
 --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px;--s8:32px;
 --fs-body:16px;--fs-sec:14px;--fs-meta:12px;--fs-h2:18px;--fs-h1:24px;
 --t1:100ms;--t2:150ms;--t3:200ms;--t4:300ms;--hit:44px;--wide:1600px;--gutter:max(var(--s4),calc((100vw - var(--wide)) / 2))}
*{box-sizing:border-box}html,body{margin:0;background:var(--night);color:var(--snow);font:400 var(--fs-sec)/1.5 Nunito,system-ui,sans-serif;overflow-x:hidden}
body{background:transparent}   /* the page background is the scene (sky, Olympus, grass); html keeps the night colour behind it */
a{color:inherit}
b,strong{font-weight:600}
/* header is chrome: full width, no max-width (only main is capped) */
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--s3);padding:var(--s2) var(--gutter) 0}  /* full-width chrome; contents line up with main */
.title h1{margin:0;font-size:var(--fs-h1);font-weight:600;line-height:1.2}
.title .sub{color:var(--powder);font-size:var(--fs-meta);line-height:1.4}.title .sub b{color:var(--snow);font-weight:600}
.argus{position:relative;width:clamp(160px,15vw,360px);aspect-ratio:1;justify-self:center}  /* looms larger on wide and ultrawide screens */
.argus>img,.argus>svg{position:absolute;inset:0;width:100%;height:100%}
.argus::before{content:"";position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,#2A9D8F26 0%,transparent 65%);pointer-events:none;transition:opacity var(--t4)}
.argus.glare::before{background:radial-gradient(circle,#D645452B 0%,transparent 65%)}
.tools{justify-self:end;display:flex;gap:var(--s4);align-items:flex-start}
.tool{all:unset;display:block;box-sizing:border-box;position:relative;width:80px;height:80px;touch-action:none;cursor:grab;flex:none;border-radius:50%}
.tool:focus-visible{outline:2px solid var(--powder);outline-offset:4px}
.tool[aria-pressed="true"]{outline:2px solid var(--bolt);outline-offset:4px}
.tool .hint{position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:var(--fs-meta);color:var(--frost);margin-top:var(--s1)}
#medusa,#bolt,#poseidon{width:80px;height:80px;display:block}
#poseidon{border-radius:50%;-webkit-user-drag:none;user-select:none}
.play-only{display:none!important}.play .play-only{display:block!important}
.shot{position:fixed;z-index:50;pointer-events:none;filter:drop-shadow(0 0 6px #FFE27A)}.shot svg{width:100%;height:100%;display:block}
#scene .debris{position:absolute;left:0;right:0;bottom:30px;height:0}.mess{position:absolute;bottom:0;transform:translateX(-50%)}.mess svg{display:block;overflow:visible}.mess.target{filter:drop-shadow(0 0 8px #9fd3ff)}
/* real tooltip (hover + keyboard focus), not title= */
.tip{position:absolute;right:0;top:calc(100% + 24px);width:240px;padding:var(--s2) var(--s3);background:var(--slate);border:1px solid var(--line);border-radius:8px;font-size:var(--fs-meta);line-height:1.4;color:var(--snow);opacity:0;pointer-events:none;transition:opacity var(--t2) ease-out;z-index:45;text-align:left}
.tool:focus-visible .tip{opacity:1}
@media (hover:hover){.tool:hover .tip{opacity:1}}
.tip kbd{font:inherit;font-size:var(--fs-meta);padding:0 var(--s1);border:1px solid var(--frost);border-radius:4px}
.floating{position:fixed!important;z-index:50;pointer-events:none;margin:0}
nav{max-width:var(--wide);margin:var(--s2) auto 0;padding:0 var(--s4);display:flex;gap:var(--s1);flex-wrap:wrap}
nav a{display:inline-flex;align-items:center;min-height:var(--hit);text-decoration:none;font-size:var(--fs-sec);font-weight:600;color:var(--powder);padding:0 var(--s3);border-radius:99px;border:1px solid transparent;transition:border-color var(--t2),background-color var(--t2)}
nav a:hover,nav a.on{color:var(--snow);border-color:var(--line);background:var(--card)}
main{max-width:var(--wide);margin:0 auto;padding:var(--s1) var(--s4) var(--s8)}
section.persona{margin-top:var(--s4)}
.ph{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s2);text-decoration:none;min-height:var(--hit)}
.ph img{width:40px;height:40px;flex:none}
.ph h2{margin:0;font-size:var(--fs-h2);font-weight:600;line-height:1.2}
.ph .dom{color:var(--powder);font-size:var(--fs-meta);line-height:1.4}
.ph .counts{margin-left:auto;color:var(--powder);font-size:var(--fs-meta);text-align:right}
.ph .counts .failed{color:var(--bad)}.ph .counts .running{color:var(--run)}.ph .counts .frozen{color:var(--stone)}
.grid{display:grid;gap:var(--s2);grid-template-columns:repeat(auto-fill,minmax(256px,1fr))}
.card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:var(--s3);box-shadow:inset 0 1px 0 rgba(255,255,255,.04);transition:border-color var(--t3) ease-out}
.card.target,.card.armed-target:focus-visible{border-color:var(--bolt);outline:none}
.card.armable{cursor:crosshair}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s2)}
.card .job{font-weight:600;font-size:var(--fs-body);word-break:break-word;line-height:1.25}
.card .unit{color:var(--frost);font-size:var(--fs-meta);line-height:1.4}
.pill{font-size:var(--fs-meta);font-weight:600;line-height:20px;padding:0 var(--s2);border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.failed{color:var(--bad)}.pill.running{color:var(--run)}.pill.never{color:var(--frost)}.pill.frozen{color:var(--stone)}
dl{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:0 var(--s2);margin:var(--s2) 0;font-size:var(--fs-sec);line-height:1.5}
dt{color:var(--powder);font-size:var(--fs-meta);align-self:baseline}dd{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-self:baseline}
dl .wide{grid-column:2/5}
.notes{color:var(--powder);font-size:var(--fs-meta);line-height:1.4;margin:0 0 var(--s2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:70ch}
.actions{display:flex;gap:var(--s2);align-items:center}
button{font:inherit;font-size:var(--fs-sec);font-weight:600;color:var(--snow);background:transparent;border:1px solid var(--line);border-radius:8px;padding:0 var(--s3);cursor:pointer;min-height:36px;min-width:var(--hit);position:relative;transition:border-color var(--t2)}
button::after{content:"";position:absolute;inset:-5px -1px}   /* stretches the hit area to 44px tall (inset is from the padding box) without a bigger-looking button */
button:hover{border-color:var(--powder)}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--powder);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
details{margin-right:auto}
details summary{cursor:pointer;color:var(--powder);font-size:var(--fs-sec);min-height:var(--hit);display:flex;align-items:center;gap:var(--s1);list-style:none}
details summary::before{content:"▸";transition:transform var(--t2)}details[open] summary::before{transform:rotate(90deg)}
pre{white-space:pre-wrap;word-break:break-all;font-size:var(--fs-meta);line-height:1.4;color:var(--powder);max-height:220px;overflow:auto;margin:var(--s2) 0 0;background:#1a1f25;border-radius:8px;padding:var(--s2)}
/* stone (frozen) */
.stone{position:absolute;inset:0;pointer-events:none;border-radius:12px;transform-origin:top center;
 background:radial-gradient(circle at 14% 22%,#ffffff1c 0 2px,transparent 3px),radial-gradient(circle at 70% 64%,#00000030 0 3px,transparent 4px),radial-gradient(circle at 86% 18%,#ffffff14 0 1.5px,transparent 2.5px),radial-gradient(circle at 36% 82%,#00000026 0 2.5px,transparent 3.5px),
 radial-gradient(ellipse at 30% 30%,#6e8a7a,#4d6358 55%,#3e5148);opacity:.93}
.stone svg{position:absolute;inset:0;width:100%;height:100%}
.card.frozen{border-color:#5f8a73}
.card.frozen > *:not(.stone){position:relative;z-index:1}
.card.frozen .job,.card.frozen dd,.card.frozen .notes,.card.frozen .unit{color:#eef3ef}
.card.frozen dt{color:#d3e0d8}
.card.shake{animation:shake var(--t4) linear 4}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,1px)}}
.empty{color:var(--powder);padding:var(--s4);border:1px dashed var(--line);border-radius:12px;font-size:var(--fs-sec)}
.empty b{display:block;color:var(--snow);font-weight:600;margin-bottom:var(--s1)}
.toast{position:fixed;left:50%;bottom:var(--s6);transform:translateX(-50%);width:max-content;max-width:min(520px,calc(100vw - 32px));display:flex;align-items:center;gap:var(--s3);background:var(--slate);border:1px solid var(--line);color:var(--snow);padding:var(--s2) var(--s2) var(--s2) var(--s4);border-radius:12px;font-size:var(--fs-sec);opacity:0;transition:opacity var(--t3) ease-out;pointer-events:none;z-index:60;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;pointer-events:auto}
.toast button{min-height:36px;flex:none}#toastText{flex:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:49;overflow:hidden}
#flash{position:fixed;inset:0;pointer-events:none;z-index:48;background:#fffbe0;opacity:0}
.p{position:absolute;will-change:transform,opacity}
.mute{margin-left:auto;align-self:center;color:var(--powder)}
/* Mentor / Practice (pattern: 3 Form - one card at a time, stats strip above) */
.practice{max-width:760px}
.decks{display:flex;gap:var(--s2);flex-wrap:wrap;margin:var(--s2) 0 var(--s3)}
.decks button[aria-pressed="true"]{border-color:var(--powder);background:var(--card)}
.mstats{color:var(--powder);font-size:var(--fs-sec);margin:0 0 var(--s3)}.mstats b{color:var(--snow);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:var(--s6);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.panel h3{margin:0 0 var(--s4);font-size:var(--fs-h2);font-weight:600;line-height:1.25}
.panel .deckname{color:var(--frost);font-size:var(--fs-meta);margin:0 0 var(--s1)}
.field label,.panel legend{display:block;font-size:var(--fs-sec);font-weight:600;margin:0 0 var(--s2)}
textarea{width:100%;min-height:120px;resize:vertical;font:inherit;font-size:var(--fs-body);line-height:1.5;color:var(--snow);background:#1a1f25;border:1px solid var(--line);border-radius:8px;padding:var(--s3)}
textarea:focus-visible{outline:2px solid var(--powder);outline-offset:2px}
.help{color:var(--powder);font-size:var(--fs-meta);margin:var(--s1) 0 0}
fieldset{border:0;padding:0;margin:var(--s4) 0}
.seg{display:flex;flex-wrap:wrap;gap:var(--s2)}
.seg label{position:relative;display:inline-flex;align-items:center;min-height:var(--hit);padding:0 var(--s3);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:400;margin:0}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg label:has(input:checked){border-color:var(--powder);background:#2b333c}
.seg label:has(input:focus-visible){outline:2px solid var(--powder);outline-offset:2px}
.row{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.primary{background:var(--snow);color:var(--night);border-color:var(--snow)}
.primary:hover{background:#fff}
.meter{height:8px;border-radius:99px;background:#1a1f25;border:1px solid var(--line);overflow:hidden;margin:var(--s2) 0 var(--s4)}
.meter span{display:block;height:100%;background:var(--ok);transform-origin:left}
.ideas{list-style:none;padding:0;margin:0 0 var(--s4)}
.ideas li{padding:var(--s1) 0;font-size:var(--fs-sec)}
.ideas .hit::before{content:"✓ ";color:var(--ok)}.ideas .miss::before{content:"○ ";color:var(--bad)}
.ideas .miss{color:var(--powder)}
.model{border-left:3px solid var(--line);padding:var(--s1) var(--s3);margin:0 0 var(--s4);color:var(--snow)}
.coach{color:var(--powder);margin:0 0 var(--s4)}
.coach b{color:var(--snow)}
.seg.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.seg.rates label{align-items:flex-start;padding:var(--s2) var(--s3)}
.seg.rates span{display:flex;flex-direction:column;gap:2px}
.seg.rates b{font-weight:600;font-size:var(--fs-sec)}.seg.rates small{color:var(--powder);font-size:var(--fs-meta);line-height:1.4}
.seg.rates .when{color:var(--snow)}
.seg.rates .tag{font-style:normal;font-size:var(--fs-meta);color:var(--ok)}
.check{display:inline-flex;align-items:center;gap:var(--s2);min-height:var(--hit);font-size:var(--fs-sec);color:var(--powder);cursor:pointer}
.check input{width:18px;height:18px;margin:0}
kbd{font:inherit;font-size:var(--fs-meta);padding:0 var(--s1);border:1px solid var(--frost);border-radius:4px}
/* confirm dialog (only for interrupting a task that is running right now) */
dialog{background:var(--card);color:var(--snow);border:1px solid var(--line);border-radius:12px;padding:var(--s6);max-width:420px;width:calc(100vw - 32px)}
dialog::backdrop{background:rgba(10,12,15,.6)}
dialog h3{margin:0 0 var(--s2);font-size:var(--fs-h2);font-weight:600;line-height:1.25}
dialog p{margin:0 0 var(--s6);color:var(--powder);line-height:1.5}
dialog .row{display:flex;justify-content:flex-end;gap:var(--s2)}
dialog .confirm{border-color:var(--danger);color:var(--danger)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---------- scene: layer order, back to front (see docs/layers.md) ----------
   html background · #scene [sky gradient · stars · storm glow · Olympus (ranges, snow, temple, clouds, summit bolt) · grass · trees · weather canvas · fog]
   · page content (realms bar, header, nav, main) · .floating tools (z 50) · #flash (48) · #fx effects (49) · toast (60) · dialog (top layer) */
#scene{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:linear-gradient(180deg,var(--sky1,#16202b) 0%,var(--sky2,#22313f) 72%,var(--sky2,#22313f) 100%);transition:background var(--t4)}
#scene[data-sky=clear]{--sky1:#152434;--sky2:#26405a}#scene[data-sky=clear][data-night]{--sky1:#0e1218;--sky2:#1a2330}
#scene[data-sky=cloudy]{--sky1:#1b2027;--sky2:#2b323b}#scene[data-sky=rain]{--sky1:#171c23;--sky2:#252c35}
#scene[data-sky=storm]{--sky1:#131219;--sky2:#22202c}#scene[data-sky=snow]{--sky1:#1d232b;--sky2:#333c47}#scene[data-sky=fog]{--sky1:#20252b;--sky2:#323840}
#scene[data-night]:not([data-sky=clear]){--sky1:#101318;--sky2:#1b2028}
#scene .stars{position:absolute;inset:0 0 40% 0;width:100%;height:60%;opacity:0;transition:opacity var(--t4)}#scene[data-night][data-sky=clear] .stars{opacity:.8}
#scene .olympus{position:absolute;left:0;right:0;bottom:44px;width:100%;height:min(46vh,440px)}
#scene .clouds{opacity:0;transition:opacity var(--t4)}#scene:is([data-sky=cloudy],[data-sky=rain],[data-sky=storm],[data-sky=snow],[data-sky=fog]) .clouds{opacity:1}
#scene[data-sky=cloudy] .clouds{opacity:.75}#scene .clouds g{animation:drift 60s ease-in-out infinite alternate}#scene .clouds g:nth-child(2){animation-duration:80s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
#scene .glow{transition:fill var(--t4)}#scene .templeglow{animation:breathe 6s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.55}50%{opacity:.9}}
#scene .sbolt{opacity:0}
#scene .ground{position:absolute;left:0;right:0;bottom:0;height:56px;background:var(--grass,linear-gradient(#1f3a28,#15261b))}
#scene .ground::before{content:"";position:absolute;left:0;right:0;top:-14px;height:16px;background:var(--tufts) repeat-x bottom/96px 16px}
#scene[data-season=winter] .ground,#scene[data-sky=snow] .ground{--grass:linear-gradient(#8593a0,#5f6b77)}
#scene .trees{position:absolute;left:0;right:0;bottom:30px;height:0}
.tree{position:absolute;bottom:0;transform-origin:50% 100%;transform:translateX(-50%)}
.tree svg{display:block;width:100%;height:auto;overflow:visible}
.tree .sway{transform-origin:50% 100%;animation:sway var(--sway,7s) ease-in-out infinite alternate}@keyframes sway{from{transform:rotate(calc(var(--lean,1deg) * -1))}to{transform:rotate(var(--lean,1deg))}}
.tree .crown,.tree .wood{transition:filter 3s ease-in}
.tree.struck .crown{filter:grayscale(1) brightness(.28) sepia(.4);transition:filter .25s}.tree.struck .wood{filter:brightness(.35);transition:filter .25s}
.tree.struck .snowcap{opacity:0;transition:opacity .2s}
.tree.target{filter:drop-shadow(0 0 10px #FFE27A)}
.tree .leaf{animation:fall var(--fd,9s) linear infinite;animation-delay:var(--fdl,0s);opacity:0}
@keyframes fall{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:.9}100%{opacity:0;transform:translate(var(--fx,-30px),95px) rotate(320deg)}}
#wx{position:absolute;inset:0;width:100%;height:100%}
#scene .fog{position:absolute;left:-10%;right:-10%;bottom:30px;height:45%;opacity:0;background:linear-gradient(transparent,#8e9aa633 40%,#8e9aa64d);transition:opacity var(--t4)}#scene[data-sky=fog] .fog{opacity:1;animation:drift 40s ease-in-out infinite alternate}
main{padding-bottom:220px!important}   /* the end of every page opens onto the grass and trees */
.wx{color:var(--powder);font-size:var(--fs-meta);margin-left:auto;white-space:nowrap}.realms .wx + .mute{margin-left:var(--s2)}
@media (max-width:767.98px){.wx{display:none}#scene .olympus{height:34vh}}
/* argus eyes: each eye covers the one painted on the medallion, so a blink never shows a second eye behind */
.argus .ball{transform-box:fill-box;transform-origin:center;transition:transform var(--t2) ease-out,opacity var(--t1)}
.argus.glare .ball{transform:scaleY(.72)}
.argus.blink .ball{transform:scaleY(.06);opacity:0}
.argus .shut{opacity:0;transition:opacity var(--t1)}.argus.blink .shut{opacity:1}
.argus .ir,.argus .pu{transition:fill var(--t4)}
/* alert: every eye turns red and glows, a red aura pulses, and an alarm badge counts failed tasks */
.argus.glare .ir{fill:#E03A3A}.argus.glare .pu{fill:#3a0d0d}
.argus.glare .ball{filter:drop-shadow(0 0 1.6px #ff4040) drop-shadow(0 0 3px #ff404099)}
.argus.glare::before{inset:-16%;background:radial-gradient(circle,#E03A3A00 44%,#E03A3A77 54%,#E03A3A22 64%,transparent 72%);animation:alarm 1.6s ease-in-out infinite}
.argus.glare>img{filter:drop-shadow(0 0 6px #ff3b3b88)}
@keyframes alarm{0%,100%{opacity:.55}50%{opacity:1}}
.alarm{position:absolute;top:6%;right:6%;display:flex;align-items:center;gap:2px;height:26px;min-width:26px;padding:0 6px;border-radius:99px;background:#C93030;color:#fff;font-size:var(--fs-meta);font-weight:600;box-shadow:0 0 0 2px var(--night),0 0 10px #ff404088;z-index:2}
.alarm svg{width:14px;height:14px;flex:none}
.argus.glare .alarm{animation:ring .9s ease-in-out 3}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
/* hub: the realm's sections. Argus watches by default; other sections keep him small in the corner */
.realms{display:flex;align-items:center;gap:var(--s1);flex-wrap:wrap;padding:var(--s2) var(--gutter);border-bottom:1px solid var(--line)}
.realm{position:relative;display:flex;align-items:center;gap:var(--s2);min-height:var(--hit);padding:var(--s1) var(--s3) var(--s1) var(--s1);border:1px solid transparent;border-radius:99px;text-decoration:none;color:var(--powder);transition:border-color var(--t2),background-color var(--t2)}
.realm img,.realm>svg{width:36px;height:36px;flex:none}
.realm b{display:block;font-size:var(--fs-sec);font-weight:600;line-height:1.2;color:var(--snow)}.realm small{display:block;font-size:var(--fs-meta);line-height:1.3}
a.realm:hover,.realm.on{border-color:var(--line);background:var(--card)}
.realm.soon{opacity:.6;cursor:default}
.realm .dot{position:absolute;left:28px;top:2px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:#C93030;color:#fff;font-size:11px;font-weight:600;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--night)}
.realms .mute{margin-left:auto}
header{grid-template-areas:"title argus tools"}.title{grid-area:title}.argus{grid-area:argus}.tools{grid-area:tools}
.hero{grid-area:hero;display:none;width:clamp(120px,10vw,240px);aspect-ratio:1;justify-self:center}
.side header{grid-template-areas:"title hero argus"}.side .hero{display:block}.side .tools,.side nav{display:none}
.side .argus{width:80px;justify-self:end;cursor:pointer;border-radius:50%}.side .argus .alarm{top:-4px;right:-4px;height:22px;min-width:22px}
.side .argus:focus-visible{outline:2px solid var(--powder);outline-offset:4px}
.play header{grid-template-columns:1fr auto auto;grid-template-areas:"title tools argus"}.play .hero{display:none}.play .tools{display:flex}
.play main{padding-bottom:260px!important}   /* room to scroll the controls clear of the trees on a phone */
.lab{max-width:560px;background:#232A31e6;border:1px solid var(--line);border-radius:12px;padding:var(--s4) var(--s6);margin-top:var(--s4)}
.lab h2{margin:0 0 var(--s1);font-size:var(--fs-h2);font-weight:600}.lab p{margin:0 0 var(--s3);color:var(--powder)}
.lab fieldset{border:0;margin:0 0 var(--s3);padding:0}.lab legend{font-weight:600;padding:0;margin-bottom:var(--s1)}
.lab .seg{display:flex;flex-wrap:wrap;gap:var(--s1)}.lab .seg label{min-height:36px}
.lab .live{font-size:var(--fs-meta);color:var(--powder);margin:0}
.tree svg{transition:filter .6s}.tree.statue svg{filter:grayscale(1) sepia(.35) hue-rotate(80deg) brightness(.85)}
.tree.statue .leaf{display:none}.tree.statue .sway{animation-play-state:paused}
@media (max-width:767.98px){header{grid-template-columns:1fr auto;grid-template-areas:"argus argus" "title tools";padding:var(--s2) var(--s3) 0}
 .argus{grid-area:argus;width:min(160px,44vw)}.title{grid-area:title}.tools{grid-area:tools;gap:var(--s2)}
 .side header{grid-template-areas:"hero hero" "title argus"}.play header{grid-template-columns:1fr auto;grid-template-areas:"title argus" "tools tools"}.play .tools{justify-self:start}.side .argus{width:64px}.hero{width:min(140px,40vw)}.realm small{display:none}
 .tool,#medusa,#bolt,#poseidon{width:64px;height:64px}.tool .hint,.tip{display:none}main,nav{padding-left:var(--s3);padding-right:var(--s3)}.grid{grid-template-columns:1fr}.ph .counts{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:1ms!important}}

<script>
const INIT = /*STATE*/null;
let S = INIT, busy = false;
const $ = (s, e = document) => e.querySelector(s), $$ = (s, e = document) => [...e.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wait = ms => new Promise(z => setTimeout(z, ms));
const RM = matchMedia('(prefers-reduced-motion: reduce)');      // reduced motion: skip particles/strikes, fade only
// works at http://<host>:8095/ and at https://<host>.<tailnet>.ts.net/argus/  (agent pages: <base>/<agent>)
const MOUNT = /^\/argus(\/|$)/.test(location.pathname) ? '/argus/' : '/';
const REST = location.pathname.slice(MOUNT.length - (location.pathname === '/argus' ? 1 : 0)).replace(/^\/+|\/+$/g, '');
const AGENT_KEYS = (S?.personas || []).map(p => p.key);
const PAGES = ['olympus'];                                    // sections that are not agents
const here = [...AGENT_KEYS, ...PAGES].includes(REST.split('/')[0]) ? REST.split('/')[0] : null;
const BASE = MOUNT;
if (location.pathname === '/argus') history.replaceState(null, '', '/argus/');
const url = p => BASE + p;
// sections that are not about watching: Argus shrinks to the corner and the section's agent takes the centre
const SIDE = ['mentor', 'olympus'];
const side = SIDE.includes(here), onOlympus = here === 'olympus';     // Olympus: a playground where the powers act on the scene
document.body.classList.toggle('side', side); document.body.classList.toggle('play', onOlympus);

/* ---------- sound ---------- */
let soundOn = true; try { soundOn = localStorage.getItem('argus-sound') !== 'off'; } catch (e) {}
const SFX = {freeze: 'static/sfx/freeze.mp3', thaw: 'static/sfx/thaw.mp3', bolt: 'static/sfx/bolt.mp3'};
const audio = Object.fromEntries(Object.entries(SFX).map(([k, v]) => { const a = new Audio(v); a.preload = 'auto'; a.volume = .8; return [k, a]; }));
function play(k) { if (!soundOn) return; try { const a = audio[k]; a.currentTime = 0; a.play().catch(() => {}); } catch (e) {} }
function muteLabel() { $('#mute').textContent = soundOn ? 'Mute sounds' : 'Unmute sounds'; }
$('#mute').onclick = () => { soundOn = !soundOn; try { localStorage.setItem('argus-sound', soundOn ? 'on' : 'off'); } catch (e) {} muteLabel(); };
muteLabel();
let actx = null;
function alarmChime() {        // two soft beeps, made in the browser (no sound file needed)
  if (!soundOn) return;
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    [[880, 0], [660, .16], [880, .32]].forEach(([f, t]) => {
      const o = actx.createOscillator(), g = actx.createGain(), at = actx.currentTime + t;
      o.type = 'triangle'; o.frequency.value = f; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(.12, at + .01); g.gain.exponentialRampToValueAtTime(.001, at + .14);
      o.start(at); o.stop(at + .15);
    });
  } catch (e) {}
}

/* ---------- toast (with an optional action, e.g. Undo) ---------- */
function toast(text, action) {
  const e = $('#toast'), b = $('#toastAct'); $('#toastText').textContent = text;
  b.hidden = !action; if (action) { b.textContent = action.label; b.onclick = () => { e.classList.remove('show'); action.fn(); }; }
  e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), action ? 8000 : 4000);
}
// plain-language results; failures say what happened and what to do next, never blame the person
const SAY = {
  freeze: {ok: j => `${j} is stone: stopped, and its timer is paused.`, verb: 'freeze'},
  thaw: {ok: j => `${j} is thawed and back on its schedule.`, verb: 'thaw'},
  bolt: {ok: (j, m) => m.includes('restart') ? `${j} restarted.` : `${j} is running now.`, verb: 'run'},
};
function failText(act, job, msg) {
  if (/frozen/.test(msg)) return `${job} is stone, so it can't run. Thaw it first, then run it.`;
  if (/no answer/.test(msg)) return `Couldn't reach the server to ${SAY[act].verb} ${job}. Check that it's on, then try again.`;
  return `Couldn't ${SAY[act].verb} ${job} (${msg}). Try again in a moment.`;
}

/* ---------- confirm dialog: only when an action would interrupt a task that is running right now ---------- */
function confirmInterrupt(act, job) {
  return new Promise(done => {
    const d = $('#confirm'), back = document.activeElement;
    $('#cTitle').textContent = act === 'freeze' ? `Freeze running task "${job}"?` : `Restart task "${job}"?`;
    $('#cBody').textContent = act === 'freeze'
      ? `It's working right now. Freezing stops this run and pauses its timer. Thawing turns it back on, but this run won't resume.`
      : `It's an always-on task. Restarting stops it and starts it again, so anything it's doing right now is cut short.`;
    $('#cOk').textContent = act === 'freeze' ? 'Freeze task' : 'Restart task';
    const close = v => { d.close(); back?.focus?.(); done(v); };
    $('#cOk').onclick = () => close(true); $('#cCancel').onclick = () => close(false);
    d.oncancel = e => { e.preventDefault(); close(false); };          // Esc = Cancel
    d.onclick = e => { if (e.target === d) close(false); };            // click outside = Cancel
    d.showModal(); $('#cCancel').focus();                             // Cancel gets focus, never the destructive button
  });
}
const isRunning = c => c.dataset.state === 'running';

/* ---------- render ---------- */
function render() {
  if (!S) return;
  const me = S.personas.find(p => p.key === here);
  if (side && !onOlympus) {
    $('.title h1').textContent = me.name; $('#sub').textContent = me.domain; document.title = `${me.name} · ${S.title || 'Argus'}`;
    $('#hero').src = `static/icons/${here}.png`;
  } else if (onOlympus) {
    $('.title h1').textContent = 'Olympus'; $('#sub').textContent = 'Playground · powers, weather, seasons'; document.title = `Olympus · ${S.title || 'Argus'}`;
  } else { $('#sub').innerHTML = `${esc(S.subtitle)} · <b>${S.jobs.length}</b> tasks watched · updated ${esc(S.updated)}`; $('.title h1').textContent = S.title || 'Argus'; }
  const realm = (href, key, name, what, on) => `<a class="realm ${on ? 'on' : ''}" href="${href}" ${on ? 'aria-current="page"' : ''}><img src="static/icons/${key}.png" alt="">${key === 'argus' ? '<span class="dot" id="realmDot" hidden></span>' : ''}<span><b>${esc(name)}</b><small>${esc(what)}</small></span></a>`;
  $('#realms').innerHTML = realm(url(''), 'argus', 'Argus', 'Watch', !side) +
    SIDE.filter(k => AGENT_KEYS.includes(k)).map(k => { const p = S.personas.find(x => x.key === k); return realm(url(k), k, p.name, p.domain.split('·')[0].trim(), here === k); }).join('') +
    realm(url('olympus'), 'olympus', 'Olympus', 'Playground', onOlympus) +
    (S.soon || []).map(x => `<span class="realm soon" aria-disabled="true"><svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" fill="#1C2127" stroke="#A7B6C4" stroke-width="1.5"/><path d="M10 26 26 10M26 26 10 10" stroke="#C9A36A" stroke-width="2" stroke-linecap="round"/><path d="M23 9h4v4M13 9H9v4" stroke="#A7B6C4" stroke-width="1.5" fill="none"/></svg><span><b>${esc(x.name)}</b><small>${esc(x.what)} · coming later</small></span></span>`).join('');
  const by = {}; S.jobs.forEach(j => (by[j.persona] ||= []).push(j));
  const shown = S.personas.filter(p => (by[p.key] || p.key === here) && !SIDE.includes(p.key));
  const tab = (k, label) => `<a href="${url(k)}" class="${here === k ? 'on' : ''}" ${here === k ? 'aria-current="page"' : ''}>${esc(label)}</a>`;
  $('#nav').innerHTML = `<a href="${url('')}" class="${here ? '' : 'on'}" ${here ? '' : 'aria-current="page"'}>All</a>` +
    shown.filter(p => !SIDE.includes(p.key)).map(p => tab(p.key, p.name)).join('');
  if (here === 'mentor') { look.retarget(); return practice.show(); }
  if (onOlympus) { look.retarget(); return scene.lab(); }
  const list = here ? shown.filter(p => p.key === here) : shown;
  $('#main').innerHTML = list.map(p => {
    const js = by[p.key] || [];
    const c = s => js.filter(j => j.state === s).length;
    const counts = ['failed', 'running', 'frozen'].filter(s => c(s)).map(s => `<span class="${s}">${c(s)} ${s === 'frozen' ? 'stone' : s}</span>`).concat(`${js.length} task${js.length === 1 ? '' : 's'}`).join(' · ');
    return `<section class="persona" aria-labelledby="h-${p.key}"><a class="ph" href="${url(p.key)}"><img src="static/icons/${p.key}.png" alt=""><div><h2 id="h-${p.key}">${esc(p.name)}</h2><div class="dom">${esc(p.domain)}</div></div><div class="counts">${counts}</div></a>
      ${js.length ? `<div class="grid">${js.map(card).join('')}</div>` : `<div class="empty"><b>No ${esc(p.name)} tasks yet</b>Background jobs named <code>${esc(p.key)}-…</code> appear here on their own, so you can watch and run them. <a href="https://github.com/Celeiritas/argus-ui#which-jobs-show-up">Learn how to add a task</a></div>`}</section>`;
  }).join('') || `<div class="empty"><b>No tasks found</b>Argus shows systemd --user jobs whose names start with an agent's key. <a href="https://github.com/Celeiritas/argus-ui#which-jobs-show-up">Learn how to add a task</a></div>`;
  $$('.card.frozen').forEach(addStone);
  if (armed) arm(armed, true);
  look.retarget();
}
function card(j) {
  const fz = j.state === 'frozen';
  return `<article class="card ${fz ? 'frozen' : ''}" data-job="${esc(j.job)}" data-state="${j.state}" data-canfreeze="${j.canfreeze}" aria-label="${esc(j.job)}, ${fz ? 'stone (frozen)' : j.state}">
   <div class="top"><div><div class="job">${esc(j.name)}</div><div class="unit">${esc(j.job)}</div></div><span class="pill ${j.state}">${fz ? 'stone' : j.state}</span></div>

/* ---------- Argus eyes: follow the pointer, glare at a failed task, calm when all is well ---------- */
const look = (() => {
  const A = $('#argus'), svg = $('svg[viewBox="0 0 234 234"]', A), eyes = $$('.eye', svg).map(g => ({iris: $('.iris', g), max: +g.dataset.max, cx: +g.dataset.cx, cy: +g.dataset.cy}));
  let pointer = null, lastMove = 0, target = null, wander = {x: 0, y: 0, t: 0}, cur = eyes.map(() => [0, 0]);
  function aim(px, py) {
    const m = svg.getScreenCTM(); if (!m) return;
    eyes.forEach((e, i) => {
      const sx = m.a * e.cx + m.e, sy = m.d * e.cy + m.f;
      const dx = px - sx, dy = py - sy, d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 220);

      e.iris.setAttribute('transform', `translate(${cur[i][0].toFixed(2)} ${cur[i][1].toFixed(2)})`);
    });
  }

  function retarget() {

    target = $('.card[data-state="failed"]');
    A.classList.toggle('glare', n > 0); A.classList.toggle('calm', !n);
    $('#alarm').hidden = !n; $('#alarmN').textContent = n > 1 ? n : '';
    const dot = $('#realmDot'); if (dot) { dot.hidden = !n; dot.textContent = n; }
    const say = n ? `${n} task${n === 1 ? '' : 's'} failed: ${bad.map(j => j.job).join(', ')}` : 'all tasks well';
    A.setAttribute('aria-label', side ? `Argus: ${say}. Open the watch page` : `Argus, the watchman: ${say}`);
    if (lastBad !== null && n > lastBad) alarmChime();               // a short alarm only when something newly fails
    lastBad = n;

  addEventListener('focusin', e => { const r = e.target.getBoundingClientRect?.(); if (r && r.width) { pointer = [r.left + r.width / 2, r.top + r.height / 2]; lastMove = performance.now(); } });  // keyboard users get watched too
  function blink() { if (!RM.matches) { A.classList.add('blink'); setTimeout(() => A.classList.remove('blink'), 150); } setTimeout(blink, 3500 + Math.random() * 5000); }
  setTimeout(blink, 4000);

    else if (!RM.matches) { if (t - wander.t > 2600) { const r = A.getBoundingClientRect(); wander = {x: r.left + r.width / 2 + (Math.random() - .5) * 700, y: r.top + r.height / 2 + Math.random() * 400, t}; } aim(wander.x, wander.y); }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  return {retarget};
})();

  const trees = $$('.tree.struck').filter(t => near(t) || t === target), gone = $$('.mess').filter(m => near(m) || (target.dataset.tree && m.dataset.of === target.dataset.tree));
  gone.forEach(m => m.animate([{opacity: 1, transform: 'translateX(-50%)'}, {opacity: 0, transform: 'translateX(10%)'}], {duration: 500, fill: 'forwards'}).onfinish = () => m.remove());
  trees.forEach(t => { t.classList.remove('struck'); $$(`.mess[data-of="${t.dataset.tree}"]`).forEach(m => m.remove()); });
  if (quiet) return;
  await wait(RM.matches ? 0 : 500);
  toast(trees.length ? `Poseidon washed it clean. ${trees.length === 1 ? 'The tree is' : 'The trees are'} growing back.` : 'Poseidon washed the debris away.');
  busy = false; sendHome('poseidon');
}
async function zeusStrike(c, fromDrag) {
  if (busy) return;
  const job = c.dataset.job;
  const held = fromDrag ? shot : null; if (held) shot = null;
  if (isRunning(c) && !(await confirmInterrupt('bolt', job))) { fizzle(held); return; }
  busy = true;
  const B = held || newShot(...homeOf('bolt')), r = c.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  await flyTo(B, x, Math.max(50, r.top - 30), 56, 150);
  play('bolt');
  const req = post('bolt', job).catch(() => ({ok: false, msg: 'no answer'}));
  if (!RM.matches) {
    B.style.opacity = '0';
    boltFx(x, y);
    const zap = document.createElement('div'); zap.style.cssText = 'position:absolute;inset:0;border-radius:12px;background:#FFE27A;pointer-events:none'; c.append(zap);
    zap.animate([{opacity: 0}, {opacity: .45, offset: .15}, {opacity: 0}], {duration: 900, easing: 'ease-out'}).onfinish = () => zap.remove();
  }
  const res = await req; await wait(RM.matches ? 0 : 900);
  toast(res.ok ? SAY.bolt.ok(job, res.msg) : failText('bolt', job, res.msg));
  B.remove(); busy = false; setTimeout(refresh, 1200);
}

/* ---------- Mentor: the Practice tab ---------- */
const practice = (() => {
  const M = {deck: null, card: null, t0: 0, result: null, shown: false};
  try { M.deck = localStorage.getItem('mentor-deck') || null; } catch (e) {}
  const get = async p => (await fetch(url('api/mentor/' + p), {cache: 'no-store'})).json();
  const send = async (p, body) => (await fetch(url('api/mentor/' + p), {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})).json();
  // shown best to worst; value = FSRS rating (4 Easy ... 1 Again)
  const RATES = [[4, 'Very well', 'Quick, easy recall'], [3, 'Well enough', 'Took moderate thought'], [2, 'Not well', 'Hard to remember or explain'], [1, 'Needs work', 'Run this card again soon']];
  const back = d => d < 1 / 24 ? `${Math.max(1, Math.round(d * 1440))} min` : d < 1 ? `${Math.round(d * 24)} hour${Math.round(d * 24) === 1 ? '' : 's'}` : `${Math.round(d)} day${Math.round(d) === 1 ? '' : 's'}`;
  const verb = v => v === 1 ? 'Run again in 10 min' : 'Save and next card';
  const CONF = [[1, 'Guessing'], [2, 'Unsure'], [3, 'Fairly sure'], [4, 'Certain']];
  function calText(c) { if (c == null) return 'not enough answers yet'; if (c > .15) return 'running overconfident'; if (c < -.15) return 'running underconfident'; return 'well calibrated'; }
  function when(ts) { if (!ts) return ''; const d = new Date(ts * 1000), m = (ts * 1000 - Date.now()) / 60000; return m < 60 ? `in ${Math.max(1, Math.round(m))} min` : m < 1440 ? `at ${d.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'})}` : d.toLocaleDateString([], {weekday: 'short', month: 'short', day: 'numeric'}); }
  async function show() {
    if (M.shown) return; M.shown = true;      // refresh() re-renders agent pages; Practice keeps its own state
    const [{decks}] = await Promise.all([get('decks')]);
    M.decks = decks;
    $('#main').innerHTML = `<section class="persona practice" aria-label="Practice">
      <div class="decks" role="group" aria-label="Deck">${[[null, 'All decks']].concat(decks.map(d => [d.id, d.name])).map(([id, n]) => `<button type="button" data-deck="${id || ''}" aria-pressed="${(M.deck || null) === id}">${esc(n)}</button>`).join('')}</div>
      <p class="mstats" id="mstats" aria-live="polite"></p><div id="mpanel"></div></section>`;
    $$('.decks button').forEach(b => b.onclick = () => { M.deck = b.dataset.deck || null; try { M.deck ? localStorage.setItem('mentor-deck', M.deck) : localStorage.removeItem('mentor-deck'); } catch (e) {} $$('.decks button').forEach(x => x.setAttribute('aria-pressed', x === b)); next(); });
    next();
  }
  async function stats() {
    const s = await get('stats' + (M.deck ? '?deck=' + encodeURIComponent(M.deck) : ''));
    $('#mstats').innerHTML = `<b>${s.due}</b> due · <b>${s.new}</b> new · <b>${s.today}</b> answered today · calibration: <b>${calText(s.calibration)}</b>${s.labels ? ` · ${s.labels} graded answer${s.labels === 1 ? '' : 's'} saved for the learning grader` : ''}`;
  }
  async function next(extra) {
    stats();
    const r = await get('next?' + (M.deck ? 'deck=' + encodeURIComponent(M.deck) + '&' : '') + (extra ? 'extra=1' : ''));
    M.card = r.card; M.result = null;
    if (!M.card) {
      $('#mpanel').innerHTML = `<div class="panel"><h3>All caught up</h3><p class="coach">Nothing is due in this deck${r.next_due ? `; the next card comes back ${when(r.next_due)}` : ''}. Spacing reviews out is what makes them stick, so stopping here is a good choice.</p>
        <button type="button" id="ahead">Practice ahead</button></div>`;
      $('#ahead').onclick = () => next(true); return;
    }
    const deckName = (M.decks.find(d => d.id === M.card.deck) || {}).name || M.card.deck;
    $('#mpanel').innerHTML = `<form class="panel" id="qform" novalidate>
      <p class="deckname">${esc(deckName)}${M.card.reps ? '' : ' · new card'}</p>
      <h3 id="qprompt">${esc(M.card.prompt)}</h3>
      <div class="field"><label for="ans">Your answer, in your own words</label>
        <textarea id="ans" aria-describedby="anshelp" autocomplete="off" spellcheck="true"></textarea>
        <p class="help" id="anshelp">Write it before peeking. Leave it blank if you don't know. <kbd>Ctrl</kbd>+<kbd>Enter</kbd> checks.</p></div>
      <fieldset><legend>How sure are you?</legend><div class="seg">${CONF.map(([v, n]) => `<label><input type="radio" name="conf" value="${v}">${n}</label>`).join('')}</div></fieldset>
      <div class="row"><button type="submit" class="primary" id="checkBtn">Check answer</button></div></form>`;
    M.t0 = performance.now();
    const ta = $('#ans'), btn = $('#checkBtn');
    const label = () => btn.textContent = ta.value.trim() ? 'Check answer' : 'Show answer';
    ta.oninput = label; label(); ta.focus();
    ta.onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('#qform').requestSubmit(); } };
    $('#qform').onsubmit = e => { e.preventDefault(); check(); };
  }
  async function check() {
    const text = $('#ans').value.trim(), conf = +($('input[name=conf]:checked')?.value || 0) || null;
    const btn = $('#checkBtn'); btn.disabled = true;
    let r; try { r = await send('answer', {card: M.card.id, text, confidence: conf, ms: Math.round(performance.now() - M.t0)}); } catch (e) { r = {ok: false}; }
    if (!r.ok) { btn.disabled = false; return toast("Couldn't reach Mentor to check that answer. Check that the server is on, then try again."); }
    M.result = r; M.grade_wrong = false;
    const n = r.hits.length + r.missed.length, pct = Math.round(r.coverage * 100);
    $('#mpanel').innerHTML = `<div class="panel" id="rpanel">
      <p class="deckname">${esc(M.card.prompt)}</p>
      <h3 tabindex="-1" id="rhead">${r.hits.length} of ${n} key ideas</h3>
      <div class="meter" role="img" aria-label="${pct}% of key ideas covered"><span style="transform:scaleX(${r.coverage})"></span></div>
      ${text ? `<p class="deckname">You wrote</p><p class="model" style="border-color:var(--frost)">${esc(text)}</p>` : ''}
      <ul class="ideas">${r.hits.map(h => `<li class="hit">${esc(h)}</li>`).join('')}${r.missed.map(h => `<li class="miss">Missing: ${esc(h)}</li>`).join('')}</ul>
      <p class="deckname">Model answer</p><p class="model">${esc(r.reference)}</p>
      <p class="coach"><b>Mentor:</b> ${esc(r.coach)}</p>
      <fieldset><legend>How well did you know it?</legend>
        <div class="seg rates">${RATES.map(([v, n, d], i) => `<label><input type="radio" name="rate" value="${v}" ${v === r.suggested ? 'checked' : ''}><span><b>${i + 1}. ${n}</b><small>${d}</small><small class="when">Back in ${back(r.previews[v])}</small>${v === r.suggested ? '<em class="tag">Mentor suggests</em>' : ''}</span></label>`).join('')}</div>
        <p class="help">Mentor's suggestion comes from the key ideas you covered; pick what feels true. Keys <kbd>1</kbd>–<kbd>4</kbd> choose, <kbd>Enter</kbd> confirms.</p></fieldset>
      <div class="row" style="margin-bottom:var(--s3)"><button type="button" class="primary" id="rateBtn">${verb(r.suggested)}</button></div>
      <label class="check"><input type="checkbox" id="gw"> Mentor's grade was wrong (your answer was better or worse than it scored)</label></div>`;
    $('#rhead').focus();
    $('#gw').onchange = e => M.grade_wrong = e.target.checked;
    const pick = () => +($('input[name=rate]:checked')?.value || 0);
    $$('input[name=rate]').forEach(i => i.onchange = () => $('#rateBtn').textContent = verb(pick()));
    $('#rateBtn').onclick = () => pick() && rate(pick());
  }
  async function rate(v) {
    if (!M.result) return; const r = M.result; M.result = null;
    let s; try { s = await send('rate', {attempt: r.attempt, rating: v, grade_wrong: M.grade_wrong}); } catch (e) { s = {ok: false}; }
    if (!s.ok) { M.result = r; return toast("Couldn't save that rating. Try again in a moment."); }
    toast(v === 1 ? 'Coming back in 10 minutes for another try.' : `Saved. Next review in ${back(s.days)}.`);
    next();
  }
  addEventListener('keydown', e => {
    if (here !== 'mentor' || !M.result || document.activeElement.tagName === 'TEXTAREA') return;
    if (/^[1-4]$/.test(e.key)) { const i = $$('input[name=rate]')[+e.key - 1]; if (i) { i.checked = true; i.dispatchEvent(new Event('change')); i.focus(); } }
    else if (e.key === 'Enter' && document.activeElement.type === 'radio') { e.preventDefault(); $('#rateBtn').click(); }
  });
  return {show};
})();

render(); setInterval(refresh, 15000);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register(url('sw.js')).catch(() => {});
