   </svg>
   <span class="hint" aria-hidden="true">Run</span>
   <span class="tip" id="tip-bolt" role="tooltip"><b>Run a task</b> – drag a bolt from here onto a task (on Olympus, drop or fling it at a tree), or press <kbd>Enter</kbd> here and then <kbd>Enter</kbd> on a task. Always-on tasks restart. <kbd>Esc</kbd> cancels.</span>
  </button>
  <button class="tool" id="medusaHome" data-tool="medusa" type="button" aria-pressed="false" aria-describedby="tip-medusa" aria-label="Freeze or thaw a task with Medusa">
   <!--MEDUSA-->
   <span class="hint" aria-hidden="true">Freeze / thaw</span>
   <span class="tip" id="tip-medusa" role="tooltip"><b>Freeze or thaw a task</b> – drag Medusa onto a task to turn it to stone (stops it and pauses its timer), or onto stone to thaw it. Keyboard: <kbd>Enter</kbd> here, then <kbd>Enter</kbd> on a task. <kbd>Esc</kbd> cancels.</span>
  </button>
